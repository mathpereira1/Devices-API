services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devices}
      POSTGRES_DB: ${POSTGRES_DB:-devices}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DevicesDb: "Host=db;Port=5432;Database=${POSTGRES_DB:-devices};Username=${POSTGRES_USER:-devices};Password=${POSTGRES_PASSWORD:-devices}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
